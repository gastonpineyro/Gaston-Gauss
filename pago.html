<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado del pago - Gauss Ortopedia</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="robots" content="noindex">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="_main.css">
</head>
<body>
    <header class="text-center py-4 border-bottom bg-white">
        <a href="index.html" class="navbar-brand text-decoration-none p-0 m-0">
            <div class="logo-gauss d-inline-block">GAUSS <span class="sub-logo-gauss">Ortopedia</span></div>
        </a>
    </header>

    <main class="container my-5 text-center" style="max-width: 560px;">
        <div id="resultado"></div>
        <div class="mt-4 d-grid gap-2">
            <a id="btnWhatsApp" class="btn-finalizar-carrito" target="_blank" rel="noopener" href="#">Escribirnos por WhatsApp</a>
            <a href="index.html" class="btn btn-outline-secondary">Volver al inicio</a>
        </div>
    </main>

    <script>
        (function () {
            var r = new URLSearchParams(location.search).get("r");
            var cont = document.getElementById("resultado");
            var msg = "Hola! Hice un pedido en la web y quería consultar por el pago.";
            if (r === "ok") {
                try { localStorage.removeItem("gauss-carrito"); } catch (e) {}
                msg = "Hola! Acabo de pagar mi pedido en la web.";
                cont.innerHTML = '<div style="font-size:48px;">✅</div><h1 class="titulo-seccion-producto" style="font-size:24px;">¡Pago recibido!</h1>' +
                    '<p class="text-secondary">Gracias por tu compra. Confirmamos la disponibilidad en 24 hs como máximo y te escribimos por WhatsApp entre 24 y 48 hs para coordinar la entrega.</p>';
            } else if (r === "pendiente") {
                try { localStorage.removeItem("gauss-carrito"); } catch (e) {}
                cont.innerHTML = '<div style="font-size:48px;">⏳</div><h1 class="titulo-seccion-producto" style="font-size:24px;">Tu pago está en proceso</h1>' +
                    '<p class="text-secondary">Mercado Pago todavía no lo acreditó. En cuanto se confirme lo vemos en nuestro sistema. Si pagaste en efectivo, puede demorar unas horas.</p>';
            } else {
                cont.innerHTML = '<div style="font-size:48px;">⚠️</div><h1 class="titulo-seccion-producto" style="font-size:24px;">No se pudo completar el pago</h1>' +
                    '<p class="text-secondary">No se te cobró nada. Tu pedido quedó registrado: podés intentar de nuevo desde el carrito o coordinarlo con nosotros por WhatsApp.</p>';
            }
            document.getElementById("btnWhatsApp").href = "https://wa.me/543415641488?text=" + encodeURIComponent(msg);
        })();
    </script>
</body>
</html>
